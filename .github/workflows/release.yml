name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install deps
        run: pnpm i
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - name: Package
        run: pnpm exec vsce package --no-dependencies
      - name: Upload vsix
        uses: actions/upload-artifact@v4
        with:
          name: markmap-plus-vsix
          path: markmap-plus-*.vsix

  github-release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: markmap-plus-vsix
      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          files: markmap-plus-*.vsix
          generate_release_notes: true

  publish-marketplace:
    name: Publish to Marketplace
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: markmap-plus-vsix
      - name: Publish to Visual Studio Marketplace
        run: npx --yes @vscode/vsce publish --no-dependencies --packagePath markmap-plus-*.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_TOKEN }}

  publish-openvsx:
    name: Publish to Open VSX
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: markmap-plus-vsix
      - name: Publish to Open VSX Registry
        run: npx --yes ovsx publish markmap-plus-*.vsix
        env:
          OVSX_PAT: ${{ secrets.OVSX_TOKEN }}
